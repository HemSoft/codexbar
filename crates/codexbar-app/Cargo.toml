[package]
name = "codexbar-app"
description = "CodexBar for Windows: GPUI dashboard and tray host"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "codexbar"
path = "src/main.rs"

[dependencies]
codexbar-core.workspace = true
codexbar-providers.workspace = true
codexbar-store.workspace = true
tray-icon.workspace = true
raw-window-handle.workspace = true
anyhow.workspace = true
windows.workspace = true
gpui-kit.workspace = true
chrono.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Headless UI integration tests: real views in in-process windows, no desktop input or focus changes.
gpui-kit = { workspace = true, features = ["test-support"] }
serde_json.workspace = true

[lints]
workspace = true
