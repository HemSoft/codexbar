[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
publish = false

[workspace.dependencies]
codexbar-core = { path = "crates/codexbar-core" }
gpui-kit = "0.7.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 2
