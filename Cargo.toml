[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
publish = false

[workspace.dependencies]
codexbar-core = { path = "crates/codexbar-core" }
codexbar-providers = { path = "crates/codexbar-providers" }
codexbar-store = { path = "crates/codexbar-store" }
gpui-kit = "0.7.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
ureq = "3.4"
tray-icon = "0.26"
raw-window-handle = "0.6"
anyhow = "1"
sha2 = "0.10"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_UI_Shell", "Data_Xml_Dom", "UI_Notifications"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 2
